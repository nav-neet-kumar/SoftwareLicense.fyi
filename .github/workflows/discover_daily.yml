name: 🔍 Daily Software Discovery

on:
  # Run every day at 08:00 UTC
  schedule:
    - cron: "0 8 * * *"
  # Allow manual trigger
  workflow_dispatch:

jobs:
  discover-software:
    name: Discover, Verify & Preserve New Software
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: 📦 Install dependencies
        run: pip install -r scripts/requirements.txt

      # Keep resumable candidate state in the private Actions cache, not public repository files.
      - name: Restore private discovery state
        id: restore_state
        uses: actions/cache/restore@v4
        with:
          path: data/discovery_state.json
          key: software-discovery-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            software-discovery-state-${{ github.ref_name }}-

      # One-time migration: preserve the pending queue from the pre-cleanup snapshot
      # if no private cache exists yet. The state is not added to the repository.
      - name: Bootstrap private state from pre-cleanup snapshot
        if: steps.restore_state.outputs.cache-hit != 'true'
        run: |
          if git cat-file -e backup/pre-site-trust-ui-latest-2026-10-29:data/discovery_state.json 2>/dev/null; then
            mkdir -p data
            git show backup/pre-site-trust-ui-latest-2026-10-29:data/discovery_state.json > data/discovery_state.json
          else
            echo "No migration snapshot available; starting with an empty queue."
          fi

      - name: 🔍 Discover and verify new software
        id: ai_check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_DISCOVERY_BATCHES: "20"
          MAX_EMPTY_BATCHES: "3"
        run: python scripts/discover_software.py

      - name: Save private discovery state
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/discovery_state.json
          key: software-discovery-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 🧠 Generate cached AI page context and static SEO pages
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGE_CONTEXT_BATCHES_PER_RUN: "2"
          PAGE_CONTEXT_BATCH_SIZE: "15"
        run: |
          ADDED=$(python -c "import json,pathlib; p=pathlib.Path('data/discovery_report.json'); print(json.loads(p.read_text()).get('added',0) if p.exists() else 0)")
          if [ "$ADDED" -gt 0 ]; then
            python scripts/generate_software_pages.py
          else
            echo "No new verified entries; skipping page-context AI calls to save tokens."
          fi

      - name: 💾 Commit data, page context, detail pages, and sitemap
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Publish only website/catalog assets. Private discovery state and detailed reports stay out of Git.
          git add -A -- data/software_list.csv data/recent_updates.json data/software_context.json data/software_sources.json sitemap.xml software/
          git diff --cached --quiet && { echo "No generated changes to commit"; exit 0; }
          OLD_COUNT=$(git show HEAD:data/software_list.csv | python -c "import csv,sys; print(sum(1 for _ in csv.DictReader(sys.stdin)))")
          NEW_COUNT=$(python -c "import csv; print(sum(1 for _ in csv.DictReader(open('data/software_list.csv', encoding='utf-8'))))")
          ADDED=$((NEW_COUNT-OLD_COUNT))
          STATUS=$(python -c "import json,pathlib; p=pathlib.Path('data/discovery_report.json'); print(json.loads(p.read_text()).get('status','unknown') if p.exists() else 'unknown')")
          git commit -m "🤖 Discovery run: $ADDED added, status $STATUS [$(date +'%Y-%m-%d')]"
          git push

      - name: 🟢🔴 Publish last AI check status
        if: always()
        env:
          AI_CHECK_OUTCOME: ${{ steps.ai_check.outcome }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Pull before writing ai_status.json so rebase sees a clean worktree.
          git pull --rebase origin "$GITHUB_REF_NAME"
          python - <<'PY'
          import datetime, json, os, pathlib
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          outcome = os.environ.get("AI_CHECK_OUTCOME", "failure").lower()
          report_path = pathlib.Path("data/discovery_report.json")
          report = {}
          if report_path.exists():
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  report = {}
          discovery_status = report.get("status", "technical_failure" if outcome != "success" else "unknown")
          status_map = {
              "success": "pass",
              "no_additions": "no_additions",
              "partial_with_errors": "partial",
              "technical_failure": "fail",
          }
          public_status = status_map.get(discovery_status, "fail")
          status_path = pathlib.Path("data/ai_status.json")
          previous = {}
          if status_path.exists():
              try:
                  previous = json.loads(status_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  previous = {}
          last_successful = previous.get("last_successful_check", "")
          if public_status in ("pass", "no_additions"):
              last_successful = now
          # Deliberately omit run URLs, provider errors, token counts, and pending candidates.
          payload = {
              "status": public_status,
              "date": now,
              "last_successful_check": last_successful,
              "workflow": "Daily Software Discovery",
          }
          status_path.parent.mkdir(parents=True, exist_ok=True)
          status_path.write_text(json.dumps(payload, indent=2) + chr(10), encoding="utf-8")
          print(json.dumps(payload))          PY
          git add data/ai_status.json
          git diff --cached --quiet && { echo "AI status unchanged"; exit 0; }
          git commit -m "ci: record latest AI discovery check status"
          git push
