name: 🔍 Daily Software Discovery

on:
  # Run every day at 08:00 UTC
  schedule:
    - cron: "0 8 * * *"
  # Allow manual trigger
  workflow_dispatch:

jobs:
  discover-software:
    name: Discover & Add 15 New Software Entries
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: 📦 Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: 🔍 Discover and verify new software
        id: ai_check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_DISCOVERY_MODELS: "gemini-3.6-flash,gemini-3.5-flash,gemini-2.5-flash"
          GEMINI_VERIFY_MODELS: "gemini-2.5-flash-lite,gemini-2.5-flash,gemini-3.6-flash"
          NEW_PER_RUN: "15"
        run: python scripts/discover_software.py

      - name: 🧠 Generate cached AI page context and static SEO pages
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CONTEXT_MODELS: "gemini-3.6-flash,gemini-3.5-flash,gemini-2.5-flash"
          PAGE_CONTEXT_BATCHES_PER_RUN: "2"
          PAGE_CONTEXT_BATCH_SIZE: "15"
        run: python scripts/generate_software_pages.py

      - name: 💾 Commit data, page context, detail pages, and sitemap
        if: steps.ai_check.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/software_list.csv data/recent_updates.json data/software_context.json data/software_sources.json sitemap.xml software/
          git diff --cached --quiet && { echo "No generated changes to commit"; exit 0; }
          OLD_COUNT=$(git show HEAD:data/software_list.csv | python -c "import csv,sys; print(sum(1 for _ in csv.DictReader(sys.stdin)))")
          NEW_COUNT=$(python -c "import csv; print(sum(1 for _ in csv.DictReader(open('data/software_list.csv', encoding='utf-8'))))")
          ADDED=$((NEW_COUNT-OLD_COUNT))
          git commit -m "🤖 Add $ADDED verified software entries and refresh SEO pages [$(date +'%Y-%m-%d')]"
          git push

      - name: 🟢🔴 Publish last AI check status
        if: always()
        env:
          AI_CHECK_OUTCOME: ${{ steps.ai_check.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Pull before writing ai_status.json so rebase sees a clean worktree.
          git pull --rebase origin "$GITHUB_REF_NAME"
          python - <<'PY'
          import datetime, json, os
          outcome = os.environ.get("AI_CHECK_OUTCOME", "failure").lower()
          payload = {
              "status": "pass" if outcome == "success" else "fail",
              "date": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "run_url": os.environ.get("RUN_URL", ""),
              "workflow": "Daily Software Discovery",
          }
          os.makedirs("data", exist_ok=True)
          with open("data/ai_status.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write(chr(10))
          print(json.dumps(payload))
          PY
          git add data/ai_status.json
          git diff --cached --quiet && { echo "AI status unchanged"; exit 0; }
          git commit -m "ci: record latest AI discovery check status"
          git push
