name: Build static software pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Generate static pages, AI context, and sitemap
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGE_CONTEXT_BATCHES_PER_RUN: "2"
          PAGE_CONTEXT_BATCH_SIZE: "15"
        run: python scripts/generate_software_pages.py
      - name: Commit generated site artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/software_context.json sitemap.xml software/
          git diff --cached --quiet && { echo "Generated pages are already current"; exit 0; }
          git commit -m "Build static software pages [skip ci]"
          git push
