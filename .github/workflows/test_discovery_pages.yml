name: Test discovery and static pages

on:
  push:
    branches:
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Compile Python scripts
        run: python -m py_compile scripts/discover_software.py scripts/generate_software_pages.py scripts/update_licenses.py
      - name: Run unit tests (mocked API; no Gemini quota)
        run: python -m unittest discover -s tests -v
