name: 🤖 Update License Data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      ai_provider:
        description: "AI Provider to use"
        required: true
        default: "gemini"
        type: choice
        options:
          - openai
          - gemini
          - anthropic

jobs:
  update-licenses:
    name: Fetch & Update License Info
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: 📦 Install dependencies
        run: | 
          python -m pip install --upgrade pip 
          pip install -r scripts/requirements.txt
          pip install google-generativeai

      - name: 🔍 Run license updater
        env:
          AI_PROVIDER: ${{ github.event.inputs.ai_provider || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_licenses.py

      - name: 🧠 Regenerate software pages and sitemap
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGE_CONTEXT_BATCHES_PER_RUN: "2"
          PAGE_CONTEXT_BATCH_SIZE: "15"
        run: python scripts/generate_software_pages.py

      - name: 💾 Commit and push updated CSV
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/software_list.csv data/recent_updates.json data/software_context.json data/software_sources.json sitemap.xml software/
          git diff --staged --quiet || git commit -m "🤖 Auto-update license data [$(date +'%Y-%m-%d')]"
          git push
