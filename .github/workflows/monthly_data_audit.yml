name: 🧹 Monthly AI Data Audit

on:
  schedule:
    # Requested run time: 26 October 2026 at 15:30 IST (10:00 UTC).
    # GitHub cron repeats yearly for this day/month; remove after the intended run.
    - cron: "0 10 26 10 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-ai-data-audit
  cancel-in-progress: false

jobs:
  audit-data:
    name: Verify software data and remove confirmed duplicates
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Audit data files with AI and official page evidence
        id: audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_AUDIT_MODELS: "gemini-2.5-flash,gemini-2.5-flash-lite"
          AUDIT_BATCH_SIZE: "12"
          AUDIT_VERIFIED_DAYS: "30"
        run: python scripts/monthly_data_audit.py

      - name: Commit validated per-software checkpoints
        if: always()
        env:
          AUDIT_STEP_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # The CSV is checkpointed after each fully accepted software decision.
          # On failure, commit only that CSV; sidecar/duplicate changes are added only after a full success.
          git add data/software_list.csv
          if [ "$AUDIT_STEP_OUTCOME" = "success" ]; then
            git add data/software_sources.json data/recent_updates.json data/software_context.json
          else
            echo "Audit did not finish. Saving validated per-software CSV checkpoints only."
          fi
          if git diff --cached --quiet; then
            echo "No checkpointed data changes to commit."
            exit 0
          fi
          git commit -m "🧹 Save validated software audit checkpoints [$(date -u +'%Y-%m-%d')]"
          git push
